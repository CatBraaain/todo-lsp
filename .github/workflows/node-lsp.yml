name: Node LSP and VSIX

on:
  pull_request:
  push:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:grammar
      - run: npm run build
      - run: npm run pack
      - working-directory: vscode-todo
        run: npm ci
      - working-directory: vscode-todo
        run: npm run typecheck
      - working-directory: vscode-todo
        run: npm test
      - working-directory: vscode-todo
        run: npm run package
      - working-directory: vscode-todo
        run: npm run test:vsix
