---
scopeName: text.todo
patterns:
  - include: "#todo"
repository:
  todo:
    patterns:
      - include: "#lines"
      - include: "#tags"
      - include: "#stylings"
  lines:
    patterns:
      - name: line.archive
        match: "(^\\s+)?Archive(:)(\\s.*)?$"
      - name: line.done
        match: "^.*@done(?:([(])([^)]*)([)]))?\\s.*$"
      - name: line.cancelled
        match: "^.*@cancelled(?:([(])([^)]*)([)]))?\\s.*$"
      - name: line.hide
        match: "^.*@hide(?:([(])([^)]*)([)]))?\\s.*$"
      - name: line.heading
        begin: "(^\\s+)?([^:]*?)(:)(?=\\s+@|$)"
        beginCaptures:
          "2":
            name: line.heading.content
          "3":
            name: line.heading.symbol
        end: "$"
        patterns:
          - include: "#tags"
  tags:
    patterns:
      - name: inline.tag.queue1
        match: "([@])(queue)([(])(1)([)])?"
      - name: inline.tag.queue2
        match: "([@])(queue)([(])(2)([)])?"
      - name: inline.tag.queue3
        match: "([@])(queue)([(])(3)([)])?"
      - name: inline.tag.queue
        match: "([@])(queue)([(])(\\d+)([)])?"
      - name: inline.tag
        match: "([@])([^\\s(]+)([(][^)]*[)])?"
  stylings:
    patterns:
      - include: "#bold"
      - include: "#italic"
      - include: "#url"
      - include: "#code"
  bold:
    name: inline.bold
    match: "([*]{2})([^*]*)([*]{2})"
    captures:
      "1":
        name: inline.bold.symbol
      "2":
        name: inline.bold.content
      "3":
        name: inline.bold.symbol
  italic:
    name: inline.italic
    match: "([*]{1})([^*]*)([*]{1})"
    captures:
      "1":
        name: inline.italic.symbol
      "2":
        name: inline.italic.content
      "3":
        name: inline.italic.symbol
  url:
    name: meta.link.inet.todo
    match: "(<)((?:https?|ftp)://.*?)(>)"
    captures:
      "1":
        name: punctuation.definition.link.todo
      "2":
        name: markup.underline.link.todo
      "3":
        name: punctuation.definition.link.todo
  code:
    name: inline.code
    match: "(`+)((?:[^`]|(?!(?<!`)\\1(?!`))`)*+)(\\1)"
    captures:
      "1":
        name: inline.code.symbol
      "2":
        name: inline.code.content
      "3":
        name: inline.code.symbol
